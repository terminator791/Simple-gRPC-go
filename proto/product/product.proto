syntax = "proto3";

package product;

option go_package = "github.com/terminator791/Simple-gRPC-go/pkg/product";

// Product service definition
service ProductService {
  // Create a new product
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  // Get product by ID
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  // Update product inventory
  rpc UpdateInventory(UpdateInventoryRequest) returns (UpdateInventoryResponse);
  // Check if product has sufficient inventory
  rpc CheckInventory(CheckInventoryRequest) returns (CheckInventoryResponse);
  // List all products
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  // Reserve inventory for an order
  rpc ReserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResponse);
  // Release reserved inventory
  rpc ReleaseInventory(ReleaseInventoryRequest) returns (ReleaseInventoryResponse);
}

// Request message for CreateProduct
message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 initial_stock = 4;
  string category = 5;
}

// Response message for CreateProduct
message CreateProductResponse {
  Product product = 1;
}

// Request message for GetProduct
message GetProductRequest {
  int64 product_id = 1;
}

// Response message for GetProduct
message GetProductResponse {
  Product product = 1;
}

// Request message for UpdateInventory
message UpdateInventoryRequest {
  int64 product_id = 1;
  int32 quantity_change = 2; // Can be positive or negative
  string reason = 3;
}

// Response message for UpdateInventory
message UpdateInventoryResponse {
  Product product = 1;
}

// Request message for CheckInventory
message CheckInventoryRequest {
  int64 product_id = 1;
  int32 required_quantity = 2;
}

// Response message for CheckInventory
message CheckInventoryResponse {
  bool available = 1;
  int32 current_stock = 2;
}

// Request message for ListProducts
message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string category = 3; // Optional filter
}

// Response message for ListProducts
message ListProductsResponse {
  repeated Product products = 1;
  int32 total_count = 2;
}

// Request message for ReserveInventory
message ReserveInventoryRequest {
  int64 product_id = 1;
  int32 quantity = 2;
  string reservation_id = 3; // UUID for the reservation
}

// Response message for ReserveInventory
message ReserveInventoryResponse {
  bool success = 1;
  string message = 2;
}

// Request message for ReleaseInventory
message ReleaseInventoryRequest {
  string reservation_id = 1;
}

// Response message for ReleaseInventory
message ReleaseInventoryResponse {
  bool success = 1;
  string message = 2;
}

// Product model
message Product {
  int64 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock_quantity = 5;
  int32 reserved_quantity = 6;
  string category = 7;
  string created_at = 8;
  string updated_at = 9;
}